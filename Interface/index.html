<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RA5olver Vulnerability Dashboard</title>
    <!-- RA5olver - Automated RA-5 Vulnerability Prioritization with XAI -->
    <!-- Copyright © 2025 Ian Rivera. All rights reserved. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2"></script>
    <link rel="stylesheet" href="/assets/styles.css">
    <script src="/assets/scripts.js" defer></script>
</head>
<body class="flex h-screen overflow-hidden bg-gray-900 text-gray-100">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden main-content lg:ml-64">
        <header class="border-b bg-gray-800">
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-2">
                    <button class="lg:hidden" onclick="toggleSidebar()">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h1 class="text-xl font-bold text-blue-600">
                        RA5olver <span class="hidden sm:inline">Vulnerability Dashboard</span>
                    </h1>
                </div>
                <div class="flex items-center gap-2">
                    <div class="relative max-w-sm">
                        <svg class="absolute left-2.5 top-2.5 h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <input id="search-query" type="search" placeholder="Search vulnerabilities..." class="pl-8 w-[200px] lg:w-[300px] border rounded-md px-3 py-2 text-sm bg-gray-700 text-gray-100 border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" oninput="filterVulnerabilities()">
                    </div>
                    <button class="rounded-full p-2 hover:bg-gray-600" onclick="toggleTheme()" aria-label="Toggle theme">
                        <svg id="theme-icon" class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4">
            <div class="container mx-auto space-y-4 py-4">
                <!-- Summary Cards -->
                <div id="summary-cards-container"></div>

                <!-- Vulnerability Table -->
                <div id="vuln-table-container"></div>
            </div>
        </main>
    </div>

    <!-- Chat Interface -->
    <div id="chat-interface-container"></div>

    <!-- Vulnerability Modal -->
    <div id="vuln-modal-container"></div>

    <script>
        // Make vulnerabilities data available client-side
        const vulnerabilities = {{ vulnerabilities | tojson | safe }};

        // Load components dynamically and initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Error handling for fetch calls with Promise return
            const loadComponent = (url, containerId) => {
                return fetch(url)
                    .then(response => {
                        if (!response.ok) throw new Error(`Failed to load ${url}: ${response.status}`);
                        return response.text();
                    })
                    .then(data => {
                        document.getElementById(containerId).innerHTML = data;
                    })
                    .catch(error => console.error(error));
            };

            // Load and initialize components sequentially
            Promise.all([
                loadComponent('/assets/sidebar.html', 'sidebar-container').then(() => updateSidebarCounts()),
                loadComponent('/assets/summary_cards.html', 'summary-cards-container').then(() => updateSummaryCards()),
                loadComponent('/assets/vuln_table.html', 'vuln-table-container').then(() => populateVulnTable()),
                loadComponent('/assets/chat_interface.html', 'chat-interface-container').then(() => populateChatCVE()),
                loadComponent('/assets/vuln_modal.html', 'vuln-modal-container')
            ]).then(() => {
                console.log('All components loaded and initialized');
            }).catch(error => {
                console.error('Error during component loading:', error);
            });

            // Theme initialization
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const storedTheme = localStorage.getItem('theme');
            const initialDarkMode = storedTheme === 'dark' || (!storedTheme && prefersDark);
            if (initialDarkMode) {
                document.documentElement.classList.add('dark');
            }

            // Basic data validation
            if (!Array.isArray(vulnerabilities)) {
                console.error('Vulnerabilities data is not an array:', vulnerabilities);
            } else if (vulnerabilities.length === 0) {
                console.warn('Vulnerabilities array is empty');
            } else {
                console.log(`Loaded ${vulnerabilities.length} vulnerabilities into client`);
            }
        });
    </script>
</body>
</html>
