<div id="chat-box" class="chat-box hidden">
    <div class="chat-header flex items-center justify-between">
        <div class="flex items-center gap-2">
            <svg class="h-5 w-5 text-gray-100" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
            </svg>
            <h3 class="font-medium text-gray-100">RA5olver Assistant</h3>
        </div>
        <div class="flex items-center gap-1">
            <button class="p-1 hover:bg-blue-700 rounded" onclick="toggleChatExpand()" aria-label="Expand chat">
                <svg class="h-4 w-4 text-gray-100" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 0h-4"></path>
                </svg>
            </button>
            <button class="p-1 hover:bg-blue-700 rounded" onclick="toggleChat()" aria-label="Close chat">
                <svg class="h-4 w-4 text-gray-100" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </div>
    <div id="chat-body" class="chat-body">
        <div class="chat-message chat-message-bot">
            Hello! I'm RA5olver's assistant. How can I help you analyze vulnerabilities today?
        </div>
    </div>
    <div class="chat-input">
        <select id="chat-cve-select" class="flex-1 border rounded-md px-3 py-2 text-sm bg-gray-700 text-gray-100 border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" aria-label="Select a vulnerability">
            <option value="">Select a Vulnerability</option>
        </select>
        <input id="chat-input" type="text" placeholder="Ask a question about a vulnerability..." class="flex-2 border rounded-md px-3 py-2 text-sm bg-gray-700 text-gray-100 border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" aria-label="Chat input">
        <button onclick="sendMessage()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-500" aria-label="Send message">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
            </svg>
        </button>
    </div>
</div>
<button class="fixed bottom-4 right-4 rounded-full h-12 w-12 bg-blue-600 text-white shadow-lg flex items-center justify-center hover:bg-blue-500" onclick="toggleChat()" aria-label="Open chat">
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
    </svg>
</button>
