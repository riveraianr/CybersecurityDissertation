<div class="grid gap-4 md:grid-cols-2 lg:grid-cols-4">
    <div class="border rounded-lg p-4 bg-gray-800 shadow-sm">
        <p class="text-sm text-gray-400">Critical Vulnerabilities</p>
        <p id="critical-vulns-count" class="text-2xl font-bold text-gray-100">0</p>
        <div class="text-xs text-gray-400 flex items-center mt-2">
            <svg class="h-4 w-4 text-red-500 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span id="critical-vulns-delta" class="text-red-500 font-medium">+0</span>&nbsp;since last scan
        </div>
    </div>
    <div class="border rounded-lg p-4 bg-gray-800 shadow-sm">
        <p class="text-sm text-gray-400">High Priority</p>
        <p id="high-priority-count" class="text-2xl font-bold text-gray-100">0</p>
        <div class="text-xs text-gray-400 flex items-center mt-2">
            <svg class="h-4 w-4 text-orange-500 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0-1.1.9-2 2-2h4a2 2 0 012 2v4a2 2 0 01-2 2h-4a2 2 0 01-2-2v-4zm-8 0c0-1.1.9-2 2-2h4a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zm0-8c0-1.1.9-2 2-2h12a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V3z"></path>
            </svg>
            <span id="high-priority-attention">0</span>&nbsp;require immediate attention
        </div>
    </div>
    <div class="border rounded-lg p-4 bg-gray-800 shadow-sm">
        <p class="text-sm text-gray-400">Active Exploits</p>
        <p id="active-exploits-count" class="text-2xl font-bold text-gray-100">0</p>
        <div class="text-xs text-gray-400 flex items-center mt-2">
            <svg class="h-4 w-4 text-blue-500 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span id="active-exploits-mitigations">0</span>&nbsp;with known mitigations
        </div>
    </div>
    <div class="border rounded-lg p-4 bg-gray-800 shadow-sm">
        <p class="text-sm text-gray-400">Remediation Progress</p>
        <p id="remediation-progress" class="text-2xl font-bold text-gray-100">0%</p>
        <div class="text-xs text-gray-400 flex items-center mt-2">
            <svg class="h-4 w-4 text-green-500 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
            </svg>
            <span class="text-green-500 font-medium">+0%</span>&nbsp;from last week
        </div>
    </div>
</div>
